<header class="app-navbar">
  <div class="brand">
    <div class="brand__logo" aria-hidden="true">{{ brandLogoText }}</div>
    <div>
      <p class="brand__name">{{ brandName }}</p>
      <p class="brand__tagline">{{ brandTagline }}</p>
    </div>
  </div>

  <nav class="app-navbar__nav" aria-label="Primary">
    <a
      class="app-navbar__nav-link"
      *ngFor="let item of navItems"
      [routerLink]="item.path"
      routerLinkActive="app-navbar__nav-link--active"
      [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
      >{{ item.label }}</a
    >
  </nav>

  <div class="header-actions">
    <button type="button" class="icon-button" aria-label="Buscar">
      <span class="material-symbols-rounded icon-button__glyph" aria-hidden="true">search</span>
    </button>
    <button type="button" class="icon-button" aria-label="Notificaciones">
      <span class="material-symbols-rounded icon-button__glyph" aria-hidden="true"
        >notifications</span
      >
      <span *ngIf="notificationCount > 0" class="badge">{{ notificationCount }}</span>
    </button>
    <button type="button" class="icon-button" aria-label="Centro de ayuda">
      <span class="material-symbols-rounded icon-button__glyph" aria-hidden="true">help</span>
    </button>
    <div class="settings-menu-container">
      <button
        type="button"
        class="icon-button icon-button--settings"
        aria-label="Ajustes"
        title="Preferencias de la app"
        (click)="toggleSettingsMenu()"
        [attr.aria-expanded]="isSettingsMenuOpen"
      >
        <span class="material-symbols-rounded icon-button__glyph" aria-hidden="true">settings</span>
      </button>
      <div class="settings-menu" *ngIf="isSettingsMenuOpen">
        <div class="settings-menu__header">
          <div>
            <p class="settings-menu__title">Preferencias rápidas</p>
            <p class="settings-menu__subtitle">Personaliza la interfaz</p>
          </div>
          <a class="settings-menu__link" [routerLink]="'/settings'">Ir a ajustes</a>
        </div>
        <div class="settings-menu__section">
          <span class="settings-menu__label">Tema</span>
          <div class="settings-menu__options">
            <button
              type="button"
              class="settings-chip"
              [class.settings-chip--active]="themePreference === 'light'"
              (click)="setThemePreference('light')"
            >
              <span class="material-symbols-rounded" aria-hidden="true">light_mode</span>
              Claro
            </button>
            <button
              type="button"
              class="settings-chip"
              [class.settings-chip--active]="themePreference === 'dark'"
              (click)="setThemePreference('dark')"
            >
              <span class="material-symbols-rounded" aria-hidden="true">dark_mode</span>
              Oscuro
            </button>
          </div>
        </div>
        <div class="settings-menu__section">
          <span class="settings-menu__label">Idioma</span>
          <div class="settings-menu__options">
            <button
              type="button"
              class="settings-chip"
              [class.settings-chip--active]="languagePreference === 'es'"
              (click)="setLanguagePreference('es')"
            >
              ES
            </button>
            <button
              type="button"
              class="settings-chip"
              [class.settings-chip--active]="languagePreference === 'en'"
              (click)="setLanguagePreference('en')"
            >
              EN
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="profile-menu-container">
      <button
        type="button"
        class="avatar-button"
        aria-label="Perfil de usuario"
        title="Mi perfil"
        (click)="toggleProfileMenu()"
      >
        <div class="avatar">{{ userInitials }}</div>
      </button>
      <div class="profile-menu" *ngIf="isProfileMenuOpen">
        <a class="profile-menu__item" [routerLink]="'/profile'">
          <span class="material-symbols-rounded profile-menu__icon" aria-hidden="true"
            >account_circle</span
          >
          <span>Mi perfil</span>
        </a>
        <a class="profile-menu__item" [routerLink]="'/subscriptions'">
          <span class="material-symbols-rounded profile-menu__icon" aria-hidden="true"
            >subscriptions</span
          >
          <span>Suscripciones</span>
        </a>
        <a class="profile-menu__item" [routerLink]="'/admin'">
          <span class="material-symbols-rounded profile-menu__icon" aria-hidden="true"
            >admin_panel_settings</span
          >
          <span>Administración</span>
        </a>
      </div>
    </div>
  </div>
</header>
