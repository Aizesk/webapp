<section class="add-transaction-page">
  <app-top-navbar [navItems]="navItems" brandTagline="Nueva Transacción"></app-top-navbar>

  <div class="page-content">
    <!-- Page Header -->
    <header class="page-header">
      <div class="page-header__info">
        <h1 class="page-header__title">Nueva transacción manual</h1>
        <p class="page-header__subtitle">Registra un ingreso o gasto manualmente</p>
      </div>
      <div class="page-header__actions">
        <button
          type="button"
          class="btn btn--ghost"
          (click)="handleCancel()"
          [disabled]="submitting()"
        >
          <span class="material-symbols-rounded">close</span>
          Cancelar
        </button>
        <button
          type="button"
          class="btn btn--primary"
          [class.btn--income]="selectedType() === 'INCOME'"
          [class.btn--expense]="selectedType() === 'EXPENSE'"
          (click)="handleSubmit()"
          [disabled]="submitting() || form.invalid"
        >
          <span class="material-symbols-rounded">{{
            submitting() ? 'hourglass_empty' : 'save'
          }}</span>
          {{ submitting() ? 'Guardando...' : 'Guardar transacción' }}
        </button>
      </div>
    </header>

    <!-- Error Banner -->
    <div *ngIf="errorMessage()" class="error-banner">
      <span class="material-symbols-rounded">error</span>
      <span>{{ errorMessage() }}</span>
    </div>

    <!-- Form -->
    <form class="transaction-form" [formGroup]="form" (ngSubmit)="handleSubmit()">
      <div class="form-card">
        <!-- Type Toggle -->
        <div class="form-section">
          <label class="form-label">Tipo de transacción</label>
          <div class="type-toggle">
            <button
              type="button"
              class="type-btn type-btn--income"
              [class.type-btn--active]="selectedType() === 'INCOME'"
              (click)="setType('INCOME')"
            >
              <span class="material-symbols-rounded">trending_up</span>
              Ingreso
            </button>
            <button
              type="button"
              class="type-btn type-btn--expense"
              [class.type-btn--active]="selectedType() === 'EXPENSE'"
              (click)="setType('EXPENSE')"
            >
              <span class="material-symbols-rounded">trending_down</span>
              Gasto
            </button>
          </div>
        </div>

        <!-- Amount + Currency Row -->
        <div class="form-row form-row--amount">
          <div class="form-section form-section--amount">
            <label class="form-label" for="amount">Monto *</label>
            <div class="amount-input-wrapper">
              <input
                id="amount"
                type="number"
                class="amount-input"
                [class.amount-input--income]="selectedType() === 'INCOME'"
                [class.amount-input--expense]="selectedType() === 'EXPENSE'"
                formControlName="amount"
                step="0.01"
                min="0.01"
                placeholder="0.00"
              />
            </div>
          </div>
          <div class="form-section form-section--currency">
            <label class="form-label" for="currency">Moneda</label>
            <select id="currency" class="form-select" formControlName="currency">
              <option *ngFor="let curr of currencies" [value]="curr.code">
                {{ curr.symbol }} {{ curr.code }}
              </option>
            </select>
          </div>
        </div>

        <!-- Date + Time Row -->
        <div class="form-row">
          <div class="form-section">
            <label class="form-label" for="date">Fecha *</label>
            <input id="date" type="date" class="form-input" formControlName="date" />
          </div>
          <div class="form-section">
            <label class="form-label" for="time">Hora *</label>
            <input id="time" type="time" class="form-input" formControlName="time" />
          </div>
        </div>

        <!-- Concept -->
        <div class="form-section">
          <label class="form-label" for="concept">Concepto *</label>
          <input
            id="concept"
            type="text"
            class="form-input"
            formControlName="concept"
            placeholder="Ej. Venta de producto, Pago de publicidad..."
            maxlength="255"
          />
          <small
            *ngIf="form.get('concept')?.invalid && form.get('concept')?.touched"
            class="form-error"
          >
            El concepto es obligatorio (máx. 255 caracteres)
          </small>
        </div>

        <!-- Category -->
        <div class="form-section">
          <label class="form-label" for="category">Categoría *</label>
          <select id="category" class="form-select" formControlName="category">
            <option *ngFor="let cat of categories()" [value]="cat.value">
              {{ cat.value }}
            </option>
          </select>
        </div>
      </div>
    </form>
  </div>
</section>
