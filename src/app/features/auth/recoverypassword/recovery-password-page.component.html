<section class="recovery">
  <div class="recovery__card">
    <div class="recovery__brand">
      <div class="recovery__logo" aria-hidden="true">A</div>
      <div class="recovery__brand-copy">
        <span class="recovery__brand-name">{{ brandName }}</span>
      </div>
    </div>

    <div class="recovery__content">
      <h2>{{ title }}</h2>
      <p>{{ subtitle }}</p>
    </div>

    <form class="recovery__form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <label class="form-field">
        <input type="email" class="form-input" formControlName="email" [placeholder]="fieldPlaceholder"
          aria-label="Correo electrónico" [class.form-input--invalid]="emailHasError"
          [disabled]="isLoading() || isSubmitted()" />
        <span class="form-error" *ngIf="emailHasError">Ingrese un correo válido</span>
      </label>

      <button type="submit" class="primary-button" [disabled]="isLoading() || isSubmitted()">
        @if (isLoading()) {
        Enviando...
        } @else if (isSubmitted()) {
        Enviado ✓
        } @else {
        {{ submitLabel }}
        }
      </button>
    </form>

    <p class="recovery__footer">
      ¿Ya tienes una cuenta?
      <a routerLink="/login" class="recovery__link">Iniciar sesión</a>
    </p>
  </div>
</section>
