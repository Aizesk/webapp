<section class="signin-page">
  <app-signin-card
    class="signin-card-wrapper"
    [brandName]="brandName"
    [title]="title"
    [description]="subtitle"
    [providers]="socialProviders"
    [loginCtaLabel]="loginCtaLabel"
    [loginLinkLabel]="loginLinkLabel"
    (providerSelected)="onProviderSelected($event)"
    (formSubmitted)="onFormSubmitted($event)"
    (loginRequested)="onNavigateToLogin()"
  />
</section>
