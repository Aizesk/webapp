# ===========================================
# CI/CD - Initialize Database Schema
# ===========================================
# Runs SQL schema + seed data on RDS
# Only triggered manually for initial setup

name: Initialize Database

on:
  workflow_dispatch:
    inputs:
      run_seed:
        description: 'Also run seed data?'
        required: true
        type: boolean
        default: false

env:
  AWS_REGION: eu-west-1

jobs:
  init-db:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get RDS endpoint
        id: rds
        run: |
          ENDPOINT=$(aws rds describe-db-instances \
            --db-instance-identifier aizesk-db \
            --query 'DBInstances[0].Endpoint.Address' \
            --output text)
          echo "endpoint=$ENDPOINT" >> $GITHUB_OUTPUT

      - name: Get DB credentials from SSM
        id: creds
        run: |
          USERNAME=$(aws ssm get-parameter --name "/aizesk/database/username" --with-decryption --query 'Parameter.Value' --output text)
          PASSWORD=$(aws ssm get-parameter --name "/aizesk/database/password" --with-decryption --query 'Parameter.Value' --output text)
          echo "::add-mask::$PASSWORD"
          echo "username=$USERNAME" >> $GITHUB_OUTPUT
          echo "password=$PASSWORD" >> $GITHUB_OUTPUT

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Run schema
        run: |
          mysql -h ${{ steps.rds.outputs.endpoint }} \
            -u ${{ steps.creds.outputs.username }} \
            -p${{ steps.creds.outputs.password }} \
            aizesk < local-deployment/db/01-schema.sql

      - name: Run seed data
        if: ${{ inputs.run_seed }}
        run: |
          mysql -h ${{ steps.rds.outputs.endpoint }} \
            -u ${{ steps.creds.outputs.username }} \
            -p${{ steps.creds.outputs.password }} \
            aizesk < local-deployment/db/02-seed-data.sql

      - name: Verify tables
        run: |
          mysql -h ${{ steps.rds.outputs.endpoint }} \
            -u ${{ steps.creds.outputs.username }} \
            -p${{ steps.creds.outputs.password }} \
            -e "USE aizesk; SHOW TABLES;"
