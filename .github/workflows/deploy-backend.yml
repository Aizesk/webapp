# ===========================================
# CI/CD - Deploy Backend Microservices
# ===========================================
# Builds Docker images, pushes to ECR, updates ECS services
# Triggered manually from webapp repo (central deployment hub)
# Each microservice lives in its own GitHub repo under Aizesk org

name: Deploy Backend

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy (or "all")'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - auth-service
          - user-service
          - transaction-service
          - subscription-service
          - platform-connection-service
          - notification-service
          - reporting-service
      ref:
        description: 'Branch/tag to deploy (default: main)'
        required: false
        default: 'main'
        type: string

env:
  AWS_REGION: eu-west-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-west-1.amazonaws.com
  ECS_CLUSTER: aizesk-cluster
  PROJECT_NAME: aizesk
  GITHUB_ORG: Aizesk

jobs:
  # ---- Resolve which services to deploy ----
  prepare:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set-services.outputs.services }}
    steps:
      - name: Determine services to deploy
        id: set-services
        run: |
          if [ "${{ inputs.service }}" = "all" ]; then
            echo 'services=["auth-service","user-service","transaction-service","subscription-service","platform-connection-service","notification-service","reporting-service"]' >> $GITHUB_OUTPUT
          else
            echo 'services=["${{ inputs.service }}"]' >> $GITHUB_OUTPUT
          fi

      - name: Print services to deploy
        run: echo "🚀 Deploying ${{ steps.set-services.outputs.services }} from branch ${{ inputs.ref }}"

  # ---- Build and Deploy each service ----
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.prepare.outputs.services) }}
      max-parallel: 3

    steps:
      - name: Checkout microservice repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITHUB_ORG }}/${{ matrix.service }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.GH_PAT }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests -B -q

      - name: Build and push Docker image
        run: |
          IMAGE_TAG="${{ env.ECR_REGISTRY }}/${{ env.PROJECT_NAME }}/${{ matrix.service }}:${{ github.sha }}"
          IMAGE_LATEST="${{ env.ECR_REGISTRY }}/${{ env.PROJECT_NAME }}/${{ matrix.service }}:latest"

          docker build -t $IMAGE_TAG -t $IMAGE_LATEST .
          docker push $IMAGE_TAG
          docker push $IMAGE_LATEST

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ matrix.service }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for deployment
        run: |
          echo "⏳ Waiting for ${{ matrix.service }} deployment to stabilize..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ matrix.service }} \
            --region ${{ env.AWS_REGION }} || echo "⚠️ Service didn't stabilize within timeout"
