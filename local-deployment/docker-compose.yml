# ===========================================
# AIZESK - LOCAL DEVELOPMENT ENVIRONMENT
# ===========================================
# Docker Compose for local development with all microservices.
# For AWS deployment, each service has its own Dockerfile ready for ECS/Fargate.
#
# Usage:
#   ./start.sh          - Start all services
#   docker-compose down - Stop all services
#   docker-compose down -v - Stop and remove volumes (clean DB)

version: '3.8'

services:
  # ========================================================================================
  # INFRASTRUCTURE SERVICES
  # ========================================================================================

  # --- Database (MySQL 8.0) ---
  mysql:
    image: mysql:8.0
    container_name: aizesk-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-password-2024}
      MYSQL_DATABASE: aizesk
      MYSQL_USER: aizesk
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-aizesk-mysql-2024}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d:ro
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root-password-2024}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - aizesk-network

  # --- Email Testing (MailHog) ---
  # In production, AWS SES is used instead
  mailhog:
    image: mailhog/mailhog:latest
    container_name: aizesk-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP Port
      - "8025:8025"  # Web UI - http://localhost:8025
    networks:
      - aizesk-network

  # ========================================================================================
  # MICROSERVICES
  # ========================================================================================

  # --- Notification Service (Port 8086) ---
  notification-service:
    build:
      context: ../../notification-service
      dockerfile: Dockerfile
    container_name: aizesk-notification-service
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      # Spring Profile
      - SPRING_PROFILES_ACTIVE=docker
      # Database
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/aizesk?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=aizesk
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD:-aizesk-mysql-2024}
      # Inter-service communication
      - AUTH_SERVICE_URL=http://auth-service:8081
      - USER_SERVICE_URL=http://user-service:8082
      # Email (MailHog for local, SES for prod)
      - MAIL_DEV_MODE=${MAIL_DEV_MODE:-true}
      - spring.mail.host=mailhog
      - spring.mail.port=1025
      # Security
      - JWT_SECRET=${JWT_SECRET:-aizesk-super-secret-key-for-jwt-tokens-2024-must-be-long-enough}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:3000}
      # AWS (for production profile)
      - AWS_REGION=${AWS_REGION:-eu-west-1}
      - AWS_SES_SMTP_USERNAME=${AWS_SES_SMTP_USERNAME:-}
      - AWS_SES_SMTP_PASSWORD=${AWS_SES_SMTP_PASSWORD:-}
    depends_on:
      mysql:
        condition: service_healthy
      mailhog:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8086/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - aizesk-network

